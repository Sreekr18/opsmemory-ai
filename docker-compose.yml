version: '3.8'

services:
  opsmemory-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsmemory-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://opsuser:opspassword@postgres:5432/opsmemory
      - HINDSIGHT_ENDPOINT=http://hindsight:8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      hindsight:
        condition: service_started
    networks:
      - opsmemory-net

  postgres:
    image: postgres:16-alpine
    container_name: opsmemory-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=opsuser
      - POSTGRES_PASSWORD=opspassword
      - POSTGRES_DB=opsmemory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsuser -d opsmemory"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opsmemory-net

  hindsight:
    image: vectorize/hindsight:latest
    container_name: opsmemory-hindsight
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - hindsight_data:/data
    networks:
      - opsmemory-net

volumes:
  postgres_data:
  hindsight_data:

networks:
  opsmemory-net:
    driver: bridge
